# Desvios permitidos do golden test — lista CONGELADA (WAVE1_FINDINGS §H).
#
# Congelada ANTES de qualquer comparação com um PDF gerado. Mudar este arquivo depois de ver
# um resultado é mover a régua: exige nova `version`, novo `frozen_on` e justificativa em DEC.
# O relatório de comparação registra o sha256 deste arquivo.
#
# Regras de validade (prog_g2_report.qa.compare.parse_allowances recusa o que violar):
#   - `reference` cita UMA anomalia catalogada em data/catalog/anomalies.jsonl (campo
#     `component`, mesmo número de relatório), OU um DEC existente em docs/decisions, OU a
#     anomalia + o DEC que decidiu como tratá-la (v1.6);
#   - `pending_decision: true` é recusada (v1.6): decisão pendente não é desvio permitido;
#   - `check` pertence ao conjunto fechado do comparador e à `dimension` declarada;
#   - `scope` explícito, sem curinga; `match` nunca vazio (nada de allowance genérica);
#   - `expected_report_number` e `internal_consistency` nunca são permitíveis.
#
# Semântica de `match` (todas as chaves presentes precisam casar):
#   kind/kinds, value/values/value_regex      item da diferença (missing/extra/order/delta)
#   reference, generated, generated_regex     valores exatos da diferença
#   reference_sequence, generated_sequence    sequências INTEIRAS do escopo (pinadas)
#   max_abs_delta                             |gerado - referência| para números
#   figure_kind, max_width_delta_cm           figuras: tipo e desvio horizontal máximo
#   max_vertical_delta_cm                     figuras: desvio vertical máximo (v1.6)
#   items: [{kind, block, value}]             narrative_facts: itens exatos, cada um cobre UMA
#                                             diferença (bloco de rodovia do contexto) (v1.6)
#   pairs: [{block, reference, generated}]    narrative_facts: o que falta e o que sobra no
#                                             mesmo bloco e campo, emparelhados (v1.6)
#
# v1.9 (comparador 4.0): `text_diff` e `toc_consistency` nunca são permitíveis por
# allowance. Hunk de texto só sai ALLOWED se estiver no conjunto de hunks aprovados
# registrado em `approved_hunks` ({report_number, file, sha256}); o arquivo é recusado se o
# sha256 não bater (editar hunks = nova versão destas allowances).
# v1.10 (comparador 4.1): o hunk aprovado é POSICIONAL (bloco, parágrafo no bloco, tokens na
# referência, bloco gerado); `--approved-hunks` no CLI também confere o sha256 registrado
# aqui. Limitação: o sha256 não protege contra quem edita hunks e allowances juntos — a
# integridade final é o Git e a revisão humana na certificação.

