      filter_columns: "B:M"
      # DEC-010 §4 (revisão 2026-10-02, builder MM): altura de cada linha = max(row_height_pt,
      # AutoFit do Excel nas colunas `columns`, na cópia em memória). 27,6 pt é o MÍNIMO (padrão
      # do nº 14); descrição de 3+ linhas cresce e nunca corta (nº 13: NT-688.1/PA-672.1; nº 14:
      # NT-734.1/NT-765.1). A paginação usa as alturas reais por linha (medidas via COM na 1ª
      # passada; offline, `row_height_estimate`).
      row_height_pt: 27.6         # mínimo (DEC-010 §4, padrão do nº 14; MEDIUM)
      row_height_mode: min_autofit
      # Estimador OFFLINE do AutoFit (sem Excel; testes e fallback): linhas = quebra por palavra
      # com `chars_per_line` caracteres por coluna com quebra automática (campos de
      # MasterListRow: Manifestação E, Descrição F, Status Entrega I); altura = max(mínimo,
      # line_height_pt × maior nº de linhas). Calibração 2026-10-02 contra o AutoFit real de
      # 2513 linhas da Lista Mestra v134.0 e v335.0 (Arial Nova Cond 11/10 pt, 120 dpi): 2510
      # iguais (±2,5 pt), 3 superestimadas, 0 subestimadas.
      row_height_estimate:
        line_height_pt: 13.8
        chars_per_line: {manifestation: 29, description: 53, delivery_status: 21}
      width_cm: 17.5
      avail_height_cm: 26.2
      paragraph_spacing_pt: 0     # parágrafo do EMF com espaçamento simples, 0 antes/depois
      aspect: frame               # altura pelo rclFrame (erro ≤ 0,12% contra o histórico)
      balance: true               # distribui as linhas por igual entre as páginas necessárias
      # DEC-010 §3 (1º recorte): o 1º recorte começa na página da frase de chamada, no espaço
      # livre medido no PDF da 1ª passada (nº 14 p24: frase e 25 linhas na mesma página). Se não
      # couberem `first_slice_min_rows` linhas, desce com a frase (keep-with-next). A folga
      # cobre o espaçamento após a frase (6 pt) e o arredondamento do Word (medido 0,11 cm).
      first_slice_fill: true
      first_slice_min_rows: 3     # nº 14 2.4: frase no pé da página, tabela na seguinte
      first_slice_gap_cm: 0.3
      # DEC-007: negrito das linhas de dados herdado da planilha (formatação de célula, não
      # dado) sai; só título e cabeçalho ficam em negrito. QA-D nº 14: 194 spans em negrito na
      # 2ª coluna do gerado, 0 na referência. Só na cópia em memória; a planilha nunca é salva.
      normalize_data_font: true
    blocks: [P2.1_CONTROLE_PRODUTOS, P2.2_CONTROLE_PRODUTOS, P2.4_CONTROLE_PRODUTOS]
    provenance: [DEC-006, DEC-010, DEC-012, "WAVE1 §A, §H"]
