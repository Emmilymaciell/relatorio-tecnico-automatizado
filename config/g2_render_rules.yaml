# REGRA DE RENDER dos visuais reconstruidos (DEC-009) e aparencia do Controle de Produtos
# Agente L (read-only) - 2026-10-01. Referencia: Relatorio G2 n 14 (Agosto/2026); conferido com n 13 (Julho/2026);
# n 11 e n 12 so como historico. Medicoes em px sobre o PNG original extraido do DOCX (word/media) e em pt/cm
# sobre o PDF (PyMuPDF). Coordenadas relativas = fracao da largura (x) e altura (y) do canvas, origem topo-esquerda.
# Fonte: em_px = altura do em no canvas canonico (cap_px / 0.70); pbi_pt = estimativa em pt do Power BI
# (canvas logico de 1280 px; captura = 1,21x). Cores = moda de pixels solidos (sem antialias).
meta:
  status: CANDIDATE
  sources:
    docx_14: "tmp/downloads/relatorios_11_14/prog - relatório grupo 2 - relatório mensal n°14 - 08 2026.docx"
    pdf_14: "tmp/downloads/relatorios_11_14/prog - relatório grupo 2 - relatório mensal n°14 - 08 2026.pdf"
    docx_13: "tmp/downloads/relatorios_11_14/prog - relatório grupo 2 - relatório mensal n°13 - 07 2026.docx"
    pdf_13: "tmp/downloads/relatorios_11_14/prog - relatório grupo 2 - relatório mensal n°13 - 07 2026.pdf"
    extracted_media: "tmp/agent_L/r{11..14}_imageNN.(png|emf)"
  reference_renders:
    - tmp/agent_L/ref_p22_road_RD-103_r14_pdf.png
    - tmp/agent_L/ref_p22_road_RD-103_r13_pdf.png
    - tmp/agent_L/ref_p24_indices_r14_pdf.png
    - tmp/agent_L/ref_p24_indices_r13_pdf.png
    - tmp/agent_L/ref_p24_condic_RD-101_r14_pdf.png
    - tmp/agent_L/ref_p24_condic_RD-101_r13_pdf.png
    - tmp/agent_L/ref_layout_r14_image13.png
    - tmp/agent_L/ref_layout_r14_image19.png
    - tmp/agent_L/ref_layout_r14_image20.png
    - tmp/agent_L/ref_controle_r14_p24_full.png
    - tmp/agent_L/ref_controle_r14_p33_full.png
    - tmp/agent_L/ref_controle_r13_p31_3line_rows.png
    - tmp/agent_L/ref_controle_r14_p24_head_400dpi.png

common_placement:
  docx: "inline, paragrafo proprio, sem wrap, sem crop, distT/B/L/R = 0"
  width_cm: 17.50
  x_on_page_cm: [2.00, 19.50]
  height: "derivada da proporcao do canvas; nunca esticar"
  format: PNG RGB
  recommended_output_px_width: 2067
  recommended_output_note: "300 dpi a 17,5 cm; historico 1532-1568 px (~226 dpi efetivos); tag dpi 120 no n14 e 96 no n13"
  scale_rule: "desenhar no canvas canonico (px) e multiplicar por k = out_width / canvas_w"
  fonts_available_here: {segoe_ui: "segoeui.ttf, segoeuib.ttf, seguisb.ttf", arial: "arial.ttf, arialbd.ttf"}
  confidence: HIGH
  evidence: "13/13 paineis PNG de n13 e n14 com 17,50 cm de largura no extent EMU e no PDF"

