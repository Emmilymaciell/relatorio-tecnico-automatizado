  confidence: CONFIRMED

selection:
  source: "Lista Mestra, aba 'Controle Geral'"
  rule: "N° Relatório == report_number"
  forbidden: "filtrar por data de entrega, status, empresa ou linha oculta"
  order: "ordem física da linha na planilha; NUNCA aplicar ORDER BY"
  order_evidence: "100% de cerca de 17 mil pares ordenados; data acerta 94%, código 69%"
  confidence: CONFIRMED

control_of_products:
  columns: [Documento, Manifestação, Descrição, Empreendimento, "Data Entrega", "Status Entrega"]
  representation: EMF          # metarquivo vetorial vindo do Excel
  width_cm: 17.5
  confidence: CONFIRMED
  blocker: "GAP-001 (P0): como gerar o EMF sem abrir o Excel à mão"
  blocks:
    - where: "dentro do produto 2.X"
      filter: "N° Relatório == N AND Produto começa com 2.X"
    - where: "índice consolidado em ANEXOS"
      filter: "N° Relatório == N"
  august_counts: {"2.1": 3, "2.2": 48, "2.4": 98, anexos: 149}

annexes:
  path_pattern: "/G2/Anexos/<Produto>/<Tipo>/<Rodovia>/<arquivo>"
  rule: "uma linha da Lista Mestra vira um anexo; pode ser arquivo ou pasta com peças"
  type_renaming: true          # o nome da pasta não é o valor da coluna
  nota_tecnica_split_by: "Descrição (Aceitação × Análise)"
  confidence: CONFIRMED

closing:
  page_count: "contagem de páginas do PDF final, por extenso entre parênteses"
