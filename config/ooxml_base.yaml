# OOXML de base do Relatório G2 — DADO declarativo para o builder (do Document() vazio).
# Promovido de tmp/agent_I/ooxml_base.yaml e tmp/agent_I/cover_ooxml.yaml (agente I, WAVE1 §I),
# com as correções da revisão adversarial (WAVE1 §H). Nada aqui é XML literal copiado do DOCX:
# cada bloco é a especificação mínima que prog_g2_report.builder.foundation / .cover serializam.
#
# Unidades: as do próprio OOXML, para não haver conversão com perda.
#   twip (dxa) = 1/20 pt = 1/1440 pol (566,93 twip = 1 cm);  meio-ponto (sz) = 1/2 pt;
#   EMU (capa, coordenadas do slide) = 1/914400 pol.
# Convenção de pPr/rPr: `true` = elemento vazio (<w:b/>); escalar = w:val; mapa = atributos
# (ou filhos, para numPr/tabs/tblCellMar/…). A ordem dos filhos é imposta pelo serializador
# conforme o schema (ECMA-376), não pela ordem do YAML.
#
# Cada bloco: `provenance` (onde está no nº 14) e `confidence`. Componentes do modelo
# (config/g2_report_model.yaml): PAGE_GEOMETRY, SECTION_SKELETON, HEADER, FOOTER, TOC, COVER.

_meta:
  name: ooxml_base
  version: "1.0"
  reference: "Relatório G2 nº 14 — Agosto/2026"
  evidence: ["tmp/agent_I/ooxml_base.yaml", "tmp/agent_I/cover_ooxml.yaml", "docs/discovery/WAVE1_FINDINGS.md §H §I", "DEC-011"]
  rule: "o DOCX histórico é evidência e medida, nunca template"

# ----------------------------------------------------------------------------------- tema
theme:
  provenance: "nº 14 word/theme/theme1.xml (a:clrScheme 'Programa', a:fontScheme 'Tema 2023')"
  confidence: CONFIRMED
  note: "o tema padrão do python-docx é Calibri/Office; o builder reescreve clrScheme e fontScheme"
  font_scheme_name: "Tema 2023"
  major_latin: "Arial Nova Cond"        # títulos e cabeçalho (majorHAnsi)
  minor_latin: "Arial Nova Light"       # corpo (minorHAnsi) — revisão H: NÃO é Arial Nova Cond
  color_scheme_name: Programa
  colors:                               # ordem do schema: dk1 lt1 dk2 lt2 accent1..6 hlink folHlink
    dk1: {srgb: "080808"}
    lt1: {sys: window, last: FFFFFF}
    dk2: {srgb: 8CC3E1}
    lt2: {srgb: 1F4993}
    accent1: {srgb: 1C5560}
    accent2: {srgb: 80BCA3}
    accent3: {srgb: E6AC27}
    accent4: {srgb: BF4D28}
    accent5: {srgb: D9D9CF}
    accent6: {srgb: "655643"}
    hlink: {srgb: 01203F}
    folHlink: {srgb: F6F7ED}

# ------------------------------------------------------------------------------ settings
settings:
  provenance: "nº 14 word/settings.xml"
  confidence: CONFIRMED
  values:
    zoom: {percent: 110}
    embedTrueTypeFonts: true
    embedSystemFonts: true
    saveSubsetFonts: true
    defaultTabStop: 708
    hyphenationZone: 425
    characterSpacingControl: doNotCompress
    updateFields: true                  # builder: o Word atualiza TOC/PAGE ao abrir (não observado no nº 14)
    themeFontLang: {val: pt-BR, eastAsia: ja-JP, bidi: ar-SA}
    decimalSymbol: ","
    listSeparator: ";"
  compat:                               # w:compat/w:compatSetting (uri http://schemas.microsoft.com/office/word)
    compatibilityMode: 15
    overrideTableStyleFontSizeAndJustification: 1
    enableOpenTypeFeatures: 1
    doNotFlipMirrorIndents: 1
    differentiateMultirowTableHeaders: 1
    useWord2013TrackBottomHyphenation: 0
  remove: [savePreviewPicture]          # resíduo do template do python-docx, ausente no nº 14
  notes:
    updateFields: "decisão do builder (BUILDER_PLAN: TOC e PAGE exigem o Word); confidence do valor: HIGH"

# ---------------------------------------------------------------------------- fontTable
font_table:
  provenance: "nº 14 word/fontTable.xml (subconjunto usado pelo builder)"
  confidence: HIGH
  note: "o Word reescreve a tabela ao salvar; os embeds (embedRegular/Bold/Italic) só o Word grava"
  fonts:
    - {name: "Times New Roman", panose1: "02020603050405020304", charset: "00", family: roman, pitch: variable}
    - {name: "Symbol", panose1: "05050102010706020507", charset: "02", family: roman, pitch: variable}
    - {name: "Courier New", panose1: "02070309020205020404", charset: "00", family: modern, pitch: fixed}
    - {name: "Wingdings", panose1: "05000000000000000000", charset: "02", family: auto, pitch: variable}
    - {name: "Arial Nova Light", charset: "00", family: swiss, pitch: variable}
    - {name: "Arial Nova Cond", charset: "00", family: swiss, pitch: variable}
    - {name: "Arial Nova Cond Light", charset: "00", family: swiss, pitch: variable, note: "data da capa (tema do slide); WAVE1 §I"}

# ------------------------------------------------------------------------- docDefaults
doc_defaults:
  provenance: "nº 14 word/styles.xml w:docDefaults"
  confidence: CONFIRMED
  rPr:
    rFonts: {asciiTheme: minorHAnsi, eastAsiaTheme: minorHAnsi, hAnsiTheme: minorHAnsi, cstheme: minorBidi}
    sz: 22                              # 11 pt — corpo = Arial Nova Light 11 (revisão H)
    szCs: 22
    lang: {val: pt-BR, eastAsia: en-US, bidi: ar-SA}
  pPr:
    spacing: {after: 160, line: 259, lineRule: auto}

