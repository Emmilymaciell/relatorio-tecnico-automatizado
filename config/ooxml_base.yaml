# -------------------------------------------------------------------------------- capa
# COVER (DEC-011, opção b'): fundo sem texto composto uma vez das mídias do slide e ancorado atrás
# do texto com sangria; textos do Word em quadros (w:framePr) com posição absoluta na página.
cover:
  provenance: "assets cover_slide_template (ppt/slides/slide1.xml sp 40/41/42, slideLayout1 '2_Slide de título'); tmp/agent_I/cover_ooxml.yaml"
  confidence: HIGH
  slide_size_emu: [6858000, 9906000]    # p:sldSz type=A4 do PowerPoint (19,05 x 27,517 cm) ≠ A4 ISO
  # O histórico estica o slide até a página inteira (anisotrópico: x 1,1024, y 1,0793; medido no PDF
  # nº 12: logos e textos em x' = 0,07 + 1,097·x, y' = 0,09 + 1,075·y cm). O builder usa o mesmo
  # mapeamento slide -> página para fundo e textos; a sangria não muda a escala: o fundo é
  # estendido (bordas replicadas) bleed_twips além de cada borda e ancorado em (-bleed, -bleed).
  bleed_twips: 57                       # ~0,1 cm; o histórico transborda 0,3–0,4 cm (acidental)
