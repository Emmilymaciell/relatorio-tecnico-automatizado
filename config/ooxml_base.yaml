# WAVE1 §I) e são reproduzidas como observadas, porque a posição do texto no PDF depende delas.
header:
  provenance: "nº 14 header1.xml (=header4.xml), header2.xml, header3.xml; posições conferidas nos PDFs nº 11–14"
  confidence: CONFIRMED
  text: "PROGRAMA | CONSÓRCIO ESTRUTURADOR DO PROGRAMA"
  paragraph_style: Cabealho
  trailing_paragraph_style: SemEspaamento
  table:
    jc: center
    border_top: {val: single, sz: 4, space: 0, color: "838383", themeColor: text1, themeTint: "80"}
    cell_margin_lr: 57
    cell_borders: {top: {val: nil}, bottom: {val: single, sz: 4, space: 0, color: auto}}
    row_height: 397
    v_align: center
    last_cell_jc: right
    look: {val: "04A0", firstRow: 1, lastRow: 0, firstColumn: 1, lastColumn: 0, noHBand: 0, noVBand: 1}
  layouts:
