  confidence: CONFIRMED
  levels: {0: Ttulo, 1: Ttulo1, 2: Ttulo2, 3: Ttulo3}

# ---------------------------------------------------------------------------- numeração
numbering:
  provenance: "nº 14 word/numbering.xml: numId 15 -> abstractNum 23 (multilevel), ligado aos estilos Ttulo1..3"
  confidence: CONFIRMED
  headings:
    num_id: 15                          # o mesmo valor citado pelo numPr dos estilos acima
    abstract_num_id: 23
    multi_level_type: multilevel
    note: "o nº 14 define 9 níveis (Ttulo4..9 apontam para estilos inexistentes); o builder emite só os 3 usados"
    levels:
      - {ilvl: 0, start: 1, numFmt: decimal, lvlText: "%1", pStyle: Ttulo1, lvlJc: left, ind: {left: 432, hanging: 432}}
      - {ilvl: 1, start: 1, numFmt: decimal, lvlText: "%1.%2", pStyle: Ttulo2, lvlJc: left, ind: {left: 576, hanging: 576}}
      - {ilvl: 2, start: 1, numFmt: decimal, lvlText: "%1.%2.%3", pStyle: Ttulo3, lvlJc: left, ind: {left: 720, hanging: 720}}

