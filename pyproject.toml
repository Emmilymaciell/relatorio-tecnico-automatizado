[project]
name = "prog-g2-report"
version = "0.0.1"
description = "Engenharia reversa e geracao do zero do Relatorio Mensal do Grupo 2 (Gestao de Engenharia e Socioambiental) do contrato Programa"
requires-python = ">=3.12"
dependencies = [
  "msal>=1.31",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Ferramentas de descoberta forense (PDF/DOCX/Excel). Instalar quando a Fase 3 comecar.
discovery = [
  "python-docx>=1.1",
  "PyMuPDF>=1.24",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "Pillow>=10",
  "lxml>=5",
  # render/visuals/_canvas.py importa matplotlib (font_manager). Sem ele, os paineis visuais
  # nao sao gerados num ambiente novo: achado pela certificacao do Emmily AI Project OS
  # (2026-10-11), que reproduziu 2 falhas de tests/test_assemble.py num venv limpo.
  "matplotlib>=3.8",
]
# Word/Excel COM (Windows). Instalar quando a Fase 7 escolher a tecnologia do builder.
office = ["pywin32>=306"]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m \"not office\""
markers = [
  "network: exige rede, certificado e .env preenchido (desmarcado por padrao)",
  "office: exige Windows + Excel/Word COM e area de transferencia exclusiva (desmarcado por padrao; rodar com -m office)",
  "golden: compara com relatorios publicados; exige evidencia local em tmp/ (so roda com -m golden)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
exclude = ["data", "output", "logs", "state", "tmp", "assets", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # documentacao e mensagens em pt-BR
  "N806",                        # nomes locais em pt-BR
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
